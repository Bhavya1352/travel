<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Voyara - AI-powered travel planner. Create personalized itineraries based on your budget, interests, and travel style." />
    <meta name="theme-color" content="#1a2e22" />
    <title>Voyara — AI Travel Planner</title>
    
    <!-- CRITICAL PERFORMANCE OPTIMIZATIONS -->
    
    <!-- Preload LCP Hero Image - Critical for LCP improvement (optimized for mobile) -->
    <link rel="preload" as="image" href="https://images.pexels.com/photos/417074/pexels-photo-417074.jpeg?auto=compress&cs=tinysrgb&w=480&q=30" media="(max-width: 768px)" />
    <link rel="preload" as="image" href="https://images.pexels.com/photos/417074/pexels-photo-417074.jpeg?auto=compress&cs=tinysrgb&w=1920&q=60" media="(min-width: 769px)" />
    
    <!-- DNS Prefetch for External Resources -->
    <link rel="dns-prefetch" href="https://images.pexels.com" />
    <link rel="dns-prefetch" href="https://api.openweathermap.org" />
    <link rel="dns-prefetch" href="https://api.frankfurter.app" />
    
    <!-- Optimized Font Loading Strategy -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Critical CSS - Inlined for faster FCP -->
    <style>
      /* Critical above-the-fold styles */
      * { box-sizing: border-box; }
      body { 
        margin: 0; 
        background: #faf8f5; 
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .hero-loading { 
        position: fixed; 
        inset: 0; 
        z-index: 9999; 
        background: #1a2e22; 
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .hero-container { 
        min-height: 100vh; 
        position: relative; 
        overflow: hidden;
      }
      .hero-bg { 
        position: absolute; 
        inset: 0; 
        z-index: 0; 
      }
      .hero-content { 
        position: relative; 
        z-index: 20; 
        padding-top: 4rem;
      }
      /* Prevent layout shift */
      .hero-bg img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
    
    <!-- Load fonts with font-display: swap for better performance -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
